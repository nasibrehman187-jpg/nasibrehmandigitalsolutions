<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Navy dark background -->
  <rect width="100" height="100" rx="16" fill="#12213D"/>

  <!-- D letterform -->
  <!-- Outer D shape - white rounded rectangle vertical bar on left, curved right side -->
  <path d="
    M 18 20
    L 18 80
    L 44 80
    Q 70 80 70 50
    Q 70 20 44 20
    Z
  " fill="#EAEEFF"/>
  <!-- Inner D cutout -->
  <path d="
    M 28 30
    L 44 30
    Q 58 30 58 50
    Q 58 70 44 70
    L 28 70
    Z
  " fill="#12213D"/>

  <!-- S letterform -->
  <!-- Upper curve of S -->
  <path d="
    M 80 28
    Q 80 18 68 18
    L 52 18
    Q 40 18 40 30
    Q 40 42 52 42
    L 68 42
    Q 80 42 80 54
    Q 80 66 68 66
    L 52 66
    Q 40 66 40 78
  " stroke="#EAEEFF" stroke-width="14" stroke-linecap="round" fill="none"/>

  <!-- Connection line: teal dot top-left to gold dot bottom-right -->
  <!-- Teal dot at top-left of connector area -->
  <circle cx="33" cy="42" r="7" fill="#087E8B"/>
  <!-- Gold dot at bottom of S area -->
  <circle cx="63" cy="60" r="7" fill="#FFB800"/>
  <!-- Diagonal line connecting them -->
  <line x1="33" y1="42" x2="63" y2="60" stroke="#FFB800" stroke-width="5" stroke-linecap="round"/>
</svg>
